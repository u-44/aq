name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

# Deny everything by default; jobs opt in to the minimum they need.
permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version package.json)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Pack
        run: |
          mkdir -p out
          npm pack --ignore-scripts --pack-destination out
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure protection rules (e.g. required reviewers, tag-only deploys) for this environment in repo settings.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@u-44/aq
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    steps:
      # No checkout and no dependency install: only the prebuilt tarball is published,
      # so no third-party code runs while the OIDC token is available.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: out

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # ships npm >= 11.5.1, required for Trusted Publishing

      - name: Publish
        run: |
          tarball=$(ls out/*.tgz)
          npm publish "./$tarball" --access public --provenance
